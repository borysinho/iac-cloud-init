AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Dos EC2 para asistencia con discos cifrados e IMDSv2: cliente Nginx publico
  y backend Node.js con MySQL local en subred privada. Instalacion de servicios y despliegue de la aplicacion desde GitHub mediante cloud-init compartido.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  Project:
    Type: String
    Default: asistencia
    AllowedPattern: "[a-z][a-z0-9-]{0,29}"
    Description: Proyecto usado en nombres y etiquetas.
  Environment:
    Type: String
    Default: cloudinit
    AllowedPattern: "[a-z][a-z0-9-]{0,19}"
    Description: Entorno usado como sufijo de nombres.
  NetworkStackName:
    Type: String
    Default: asistencia-cloudinit-network
    Description: Nombre exacto de la pila de red completada antes de esta pila.
  SshPublicKey:
    Type: String
    AllowedPattern: 'ssh-(ed25519|rsa) [A-Za-z0-9+/]+={0,3}( [^\r\n]+)?'
    Description: Contenido de la clave PUBLICA OpenSSH existente, nunca la privada.
  AppRevision:
    Type: String
    Default: 9e4d440276547607498f8aa3342c6234bb030f45
    AllowedPattern: '[a-f0-9]{40}'
    Description: Commit publicado del repositorio publico borysinho/iac-cloud-init; contiene app/.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/noble/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: AMI oficial Ubuntu Server 24.04 LTS amd64.
Resources:
  GlobomaticsKeyPair:
    Type: AWS::EC2::KeyPair
    Metadata:
      com.aws.cloudformation.Context:
        why: Importar la publica existente compartida por los dos EC2.
        must:
          [
            PublicKeyMaterial debe estar presente para no generar una clave privada en AWS.,
          ]
    Properties:
      KeyName: !Sub "key-${AWS::StackName}"
      PublicKeyMaterial: !Ref SshPublicKey
      Tags:
        - { Key: Name, Value: !Sub "key-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsClient:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: Servidor cliente con Nginx, archivos publicos y proxy hacia backend mediante cloud-init; volumen raiz hereda las etiquetas del EC2.
        must:
          - Desplegar tras completar network.yaml; subred y grupo deben pertenecer a su misma VPC.
          - Conservar IP privada fija, IP publica dinamica, cifrado e IMDSv2 obligatorio.
          - Respaldar datos antes del reemplazo o borrado; el disco raiz se elimina con el EC2.
        mutable: review-required
    Properties:
      # BEGIN SHARED CLOUD INIT
      UserData: {"Fn::Base64": {"Fn::Join": ["", ["#cloud-config\n# Fuente comun: HTTPS autofirmado, aplicacion y servicios. Ubuntu 24.04 amd64.\ntimezone: America/La_Paz\nssh_pwauth: false\ndisable_root: true\nwrite_files:\n- path: /usr/local/sbin/asistencia-install-services\n  owner: root:root\n  permissions: '0750'\n  content: |\n    #!/bin/bash\n    set -euo pipefail\n    trap 'echo \"ERROR: instalacion de servicios interrumpida en linea $LINENO\" >&2' ERR\n\n    # Este archivo compartido funciona con las IP privadas del laboratorio.\n    # Cambiar aqui el mapa si las futuras herramientas cambian las direcciones.\n    local_ipv4=$(ip -4 -o address show scope global | awk '{split($4, a, \"/\"); print a[1]}')\n    if grep -Fxq '10.42.1.10' <<< \"$local_ipv4\"; then\n        role=client\n    elif grep -Fxq '10.42.2.20' <<< \"$local_ipv4\"; then\n        role=backend\n    else\n        echo \"IP privada desconocida; no se instalaran servicios\" >&2\n        exit 1\n    fi\n\n    . /etc/os-release\n    if [[ \"$ID\" != ubuntu || \"$VERSION_ID\" != 24.04 ]]; then\n        echo \"Esta configuracion requiere Ubuntu Server 24.04\" >&2\n        exit 1\n    fi\n    export DEBIAN_FRONTEND=noninteractive\n    export NEEDRESTART_MODE=a\n    # Esperar los bloqueos de APT y reintentar descargas transitorias.\n    apt_options=(-o DPkg::Lock::Timeout=300 -o Acquire::Retries=5)\n    apt-get \"${apt_options[@]}\" -o APT::Update::Error-Mode=any update\n\n    case \"$role\" in\n        client)\n            apt-get \"${apt_options[@]}\" install -y --no-install-recommends nginx ca-certificates curl openssl\n            nginx -t\n            systemctl enable --now nginx\n            systemctl is-active --quiet nginx\n            ;;\n        backend)\n            apt-get \"${apt_options[@]}\" install -y --no-install-recommends ca-certificates curl gnupg\n            install -d -m 0755 /usr/share/keyrings\n            key_file=$(mktemp)\n            trap 'rm -f \"$key_file\"' EXIT\n            curl --fail --silent --show-error --location --retry 5 --connect-timeout 10 --max-time 120 \\\n                https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o \"$key_file\"\n            gpg --batch --yes --dearmor -o /usr/share/keyrings/nodesource.gpg \"$key_file\"\n            chmod 0644 /usr/share/keyrings/nodesource.gpg\n            cat > /etc/apt/sources.list.d/nodesource.sources <<'REPO'\n    Types: deb\n    URIs: https://deb.nodesource.com/node_24.x\n    Suites: nodistro\n    Components: main\n    Architectures: amd64\n    Signed-By: /usr/share/keyrings/nodesource.gpg\n    REPO\n            apt-get \"${apt_options[@]}\" -o APT::Update::Error-Mode=any update\n            apt-get \"${apt_options[@]}\" install -y --no-install-recommends nodejs mysql-server\n            # La aplicacion se conecta por TCP local, sin exponer MySQL a la VPC.\n            cat > /etc/mysql/mysql.conf.d/99-asistencia.cnf <<'MYSQL'\n    [mysqld]\n    bind-address = 127.0.0.1\n    mysqlx-bind-address = 127.0.0.1\n    MYSQL\n            systemctl enable mysql\n            systemctl restart mysql\n            systemctl is-active --quiet mysql\n            node --version | grep -E '^v24\\.'\n            npm --version\n            mysqladmin --protocol=socket ping\n            mysql --protocol=socket --batch --skip-column-names \\\n                -e \"SELECT @@bind_address, @@mysqlx_bind_address;\"\n            ;;\n    esac\n    echo \"Servicios de $role instalados correctamente\"\n\n    /usr/local/sbin/asistencia-deploy\n- path: /etc/asistencia-bootstrap.env\n  owner: root:root\n  permissions: '0600'\n  content: |\n    APP_ARCHIVE_URL='", {"Fn::Join": ["", ["https://github.com/borysinho/iac-cloud-init/archive/", {"Ref": "AppRevision"}, ".tar.gz"]]}, "'\n    FRONTEND_ORIGIN='", "https://127.0.0.1", "'\n- path: /usr/local/sbin/asistencia-deploy\n  owner: root:root\n  permissions: '0750'\n  content: |\n    #!/bin/bash\n    set -euo pipefail\n    trap 'echo \"ERROR: despliegue de asistencia interrumpido en linea $LINENO\" >&2' ERR\n    . /etc/asistencia-bootstrap.env\n    local_ipv4=$(ip -4 -o address show scope global | awk '{split($4,a,\"/\"); print a[1]}')\n    if grep -Fxq '10.42.1.10' <<< \"$local_ipv4\"; then\n        role=client\n    elif grep -Fxq '10.42.2.20' <<< \"$local_ipv4\"; then\n        role=backend\n    else\n        echo 'IP privada desconocida' >&2; exit 1\n    fi\n    stage=$(mktemp -d)\n    trap 'rm -rf \"$stage\"' EXIT\n    curl --fail --silent --show-error --location --retry 5 --connect-timeout 10 --max-time 300 \\\n        \"$APP_ARCHIVE_URL\" -o \"$stage/app.tar.gz\"\n    tar -xzf \"$stage/app.tar.gz\" --strip-components=1 -C \"$stage\"\n    source_dir=\"$stage/app\"\n    if [[ \"$role\" == client ]]; then\n        install -d -m 0755 /var/www/asistencia\n        install -m 0644 \"$source_dir\"/public/{index.html,app.js,styles.css,config.js} /var/www/asistencia/\n        sed 's|http://192.168.1.30:8090|http://10.42.2.20:8090|' \\\n            \"$source_dir/deploy/client/asistencia.conf\" > /etc/nginx/conf.d/asistencia.conf\n        # Certificado local: clave privada solo en el cliente; SAN con su IP publica actual.\n        token=$(curl --fail --silent --show-error --max-time 10 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)\n        public_ip=$(curl --fail --silent --show-error --max-time 10 -H \"X-aws-ec2-metadata-token: $token\" http://169.254.169.254/latest/meta-data/public-ipv4)\n        python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' \"$public_ip\"\n        if [[ ! -s /etc/ssl/private/asistencia.key || ! -s /etc/ssl/certs/asistencia.crt ]] || \\\n            ! openssl x509 -in /etc/ssl/certs/asistencia.crt -noout -checkend 2592000 >/dev/null || \\\n            ! openssl x509 -in /etc/ssl/certs/asistencia.crt -noout -checkip \"$public_ip\" >/dev/null; then\n            umask 077\n            openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 365 \\\n                -keyout /etc/ssl/private/asistencia.key -out /etc/ssl/certs/asistencia.crt \\\n                -subj \"/CN=$public_ip\" -addext \"subjectAltName=IP:$public_ip,IP:10.42.1.10,IP:127.0.0.1\"\n        fi\n        chmod 0600 /etc/ssl/private/asistencia.key\n        chmod 0644 /etc/ssl/certs/asistencia.crt\n        python3 - <<'TLS'\n    from pathlib import Path\n    path = Path('/etc/nginx/conf.d/asistencia.conf')\n    content = path.read_text().replace('    listen 80;', '    listen 443 ssl;\\n    ssl_certificate /etc/ssl/certs/asistencia.crt;\\n    ssl_certificate_key /etc/ssl/private/asistencia.key;\\n    ssl_protocols TLSv1.2 TLSv1.3;')\n    redirect = 'server { listen 80; server_name _; return 301 https://$host$request_uri; }\\n'\n    path.write_text(redirect + content)\n    TLS\n        # Ubuntu incluye su sitio predeterminado en sites-enabled.\n        rm -f /etc/nginx/sites-enabled/default\n        nginx -t\n        systemctl reload nginx\n        curl --fail --silent --show-error --cacert /etc/ssl/certs/asistencia.crt https://127.0.0.1/ -o /dev/null\n    else\n        if ! id asistencia >/dev/null 2>&1; then\n            useradd --system --user-group --home-dir /opt/asistencia --no-create-home --shell /usr/sbin/nologin asistencia\n        fi\n        install -d -o root -g asistencia -m 0750 /opt/asistencia\n        # No reemplazar el archivo de secretos ni eliminar datos MySQL existentes.\n        for directory in src scripts database; do\n            cp -a \"$source_dir/$directory\" /opt/asistencia/\n        done\n        install -d -m 0750 /opt/asistencia/deploy/backend\n        install -m 0640 \"$source_dir/deploy/backend/asistencia.service\" /opt/asistencia/deploy/backend/\n        install -m 0640 \"$source_dir/package.json\" \"$source_dir/package-lock.json\" /opt/asistencia/\n        export FRONTEND_ORIGIN\n        python3 - <<'PY'\n    from pathlib import Path\n    import os, secrets, subprocess, tempfile\n    path = Path('/opt/asistencia/.env.backend')\n    values = {}\n    if path.exists():\n        for line in path.read_text().splitlines():\n            if line and not line.startswith('#'):\n                key, value = line.split('=', 1)\n                values[key] = value\n    else:\n        values = dict(DB_PASSWORD=secrets.token_hex(32), ADMIN_USER='admin', ADMIN_PASSWORD=secrets.token_hex(24))\n    # Esta cuenta y base son exclusivas de la aplicacion.\n    values.update(BACKEND_HOST='10.42.2.20', PORT='8090', FRONTEND_ORIGINS=os.environ['FRONTEND_ORIGIN'],\n                  TRUSTED_PROXIES='10.42.1.10', DB_HOST='127.0.0.1', DB_PORT='3306',\n                  DB_USER='asistencia', DB_NAME='uagrm_asistencia', INSTITUTION_TIMEZONE='America/La_Paz')\n    if not values.get('DB_PASSWORD') or len(values.get('ADMIN_PASSWORD','')) < 12:\n        raise SystemExit('Revisar credenciales del archivo existente; no se regeneran automaticamente')\n    # Guardar antes de crear el usuario permite recuperar la misma clave tras un fallo.\n    fd, temporary = tempfile.mkstemp(prefix='.env-', dir=path.parent)\n    try:\n        with os.fdopen(fd, 'w') as stream:\n            stream.write(''.join(f'{key}={value}\\n' for key,value in values.items()))\n        os.replace(temporary, path)\n    finally:\n        Path(temporary).unlink(missing_ok=True)\n    password = values['DB_PASSWORD'].replace(\"'\", \"''\")\n    sql = \"SET SESSION sql_mode='NO_BACKSLASH_ESCAPES';\\n\"\n    sql += \"CREATE DATABASE IF NOT EXISTS uagrm_asistencia CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\\n\"\n    sql += f\"CREATE USER IF NOT EXISTS 'asistencia'@'127.0.0.1' IDENTIFIED BY '{password}';\\n\"\n    sql += f\"ALTER USER 'asistencia'@'127.0.0.1' IDENTIFIED BY '{password}';\\n\"\n    sql += \"GRANT ALL PRIVILEGES ON uagrm_asistencia.* TO 'asistencia'@'127.0.0.1';\\n\"\n    subprocess.run(['mysql','--protocol=socket'], input=sql, text=True, check=True)\n    PY\n        cd /opt/asistencia\n        npm ci --omit=dev --no-audit --no-fund\n        npm run db:init\n        chown -R root:asistencia /opt/asistencia\n        chmod -R u=rwX,g=rX,o= /opt/asistencia\n        chmod 0640 /opt/asistencia/.env.backend\n        sed 's/^After=.*/After=network-online.target mysql.service\\nRequires=mysql.service/' \\\n            deploy/backend/asistencia.service > /etc/systemd/system/asistencia.service\n        systemctl daemon-reload\n        systemctl enable asistencia\n        systemctl restart asistencia\n        ready=false\n        for attempt in {1..30}; do\n            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://10.42.2.20:8090/api/me || true)\n            if [[ \"$status\" == 401 ]]; then ready=true; break; fi\n            sleep 2\n        done\n        [[ \"$ready\" == true ]]\n        systemctl is-active --quiet asistencia\n    fi\n    echo \"Aplicacion desplegada en $role; las credenciales no se imprimen en el registro\"\nruncmd:\n- - /usr/local/sbin/asistencia-install-services\n"]]}}
      # END SHARED CLOUD INIT
      ImageId: !Ref LatestAmiId
      CreditSpecification:
        CPUCredits: standard
      InstanceType: t3.micro
      KeyName: !Ref GlobomaticsKeyPair
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 12
            Encrypted: true
            DeleteOnTermination: true
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: {Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnetId'}
          PrivateIpAddress: 10.42.1.10
          GroupSet: [{Fn::ImportValue: !Sub '${NetworkStackName}-ClientSecurityGroupId'}]
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - { Key: Name, Value: !Sub "ec2-cliente-${Project}-${Environment}" }
        - { Key: Role, Value: client }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsBackend:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: Backend con codigo, base inicializada, credenciales locales y servicio systemd; sin IP publica, con salida por NAT para instalar Node.js y MySQL; SSH mediante frontend bastion y API solo desde frontend.
        must:
          - Desplegar tras completar network.yaml; subred y grupo deben pertenecer a su misma VPC.
          - Conservar IP privada fija, ausencia de IP publica, salida por NAT, cifrado e IMDSv2 obligatorio.
          - Respaldar datos antes del reemplazo o borrado; el disco raiz se elimina con el EC2.
        mutable: review-required
    Properties:
      # BEGIN SHARED CLOUD INIT
      UserData: {"Fn::Base64": {"Fn::Join": ["", ["#cloud-config\n# Fuente comun: HTTPS autofirmado, aplicacion y servicios. Ubuntu 24.04 amd64.\ntimezone: America/La_Paz\nssh_pwauth: false\ndisable_root: true\nwrite_files:\n- path: /usr/local/sbin/asistencia-install-services\n  owner: root:root\n  permissions: '0750'\n  content: |\n    #!/bin/bash\n    set -euo pipefail\n    trap 'echo \"ERROR: instalacion de servicios interrumpida en linea $LINENO\" >&2' ERR\n\n    # Este archivo compartido funciona con las IP privadas del laboratorio.\n    # Cambiar aqui el mapa si las futuras herramientas cambian las direcciones.\n    local_ipv4=$(ip -4 -o address show scope global | awk '{split($4, a, \"/\"); print a[1]}')\n    if grep -Fxq '10.42.1.10' <<< \"$local_ipv4\"; then\n        role=client\n    elif grep -Fxq '10.42.2.20' <<< \"$local_ipv4\"; then\n        role=backend\n    else\n        echo \"IP privada desconocida; no se instalaran servicios\" >&2\n        exit 1\n    fi\n\n    . /etc/os-release\n    if [[ \"$ID\" != ubuntu || \"$VERSION_ID\" != 24.04 ]]; then\n        echo \"Esta configuracion requiere Ubuntu Server 24.04\" >&2\n        exit 1\n    fi\n    export DEBIAN_FRONTEND=noninteractive\n    export NEEDRESTART_MODE=a\n    # Esperar los bloqueos de APT y reintentar descargas transitorias.\n    apt_options=(-o DPkg::Lock::Timeout=300 -o Acquire::Retries=5)\n    apt-get \"${apt_options[@]}\" -o APT::Update::Error-Mode=any update\n\n    case \"$role\" in\n        client)\n            apt-get \"${apt_options[@]}\" install -y --no-install-recommends nginx ca-certificates curl openssl\n            nginx -t\n            systemctl enable --now nginx\n            systemctl is-active --quiet nginx\n            ;;\n        backend)\n            apt-get \"${apt_options[@]}\" install -y --no-install-recommends ca-certificates curl gnupg\n            install -d -m 0755 /usr/share/keyrings\n            key_file=$(mktemp)\n            trap 'rm -f \"$key_file\"' EXIT\n            curl --fail --silent --show-error --location --retry 5 --connect-timeout 10 --max-time 120 \\\n                https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o \"$key_file\"\n            gpg --batch --yes --dearmor -o /usr/share/keyrings/nodesource.gpg \"$key_file\"\n            chmod 0644 /usr/share/keyrings/nodesource.gpg\n            cat > /etc/apt/sources.list.d/nodesource.sources <<'REPO'\n    Types: deb\n    URIs: https://deb.nodesource.com/node_24.x\n    Suites: nodistro\n    Components: main\n    Architectures: amd64\n    Signed-By: /usr/share/keyrings/nodesource.gpg\n    REPO\n            apt-get \"${apt_options[@]}\" -o APT::Update::Error-Mode=any update\n            apt-get \"${apt_options[@]}\" install -y --no-install-recommends nodejs mysql-server\n            # La aplicacion se conecta por TCP local, sin exponer MySQL a la VPC.\n            cat > /etc/mysql/mysql.conf.d/99-asistencia.cnf <<'MYSQL'\n    [mysqld]\n    bind-address = 127.0.0.1\n    mysqlx-bind-address = 127.0.0.1\n    MYSQL\n            systemctl enable mysql\n            systemctl restart mysql\n            systemctl is-active --quiet mysql\n            node --version | grep -E '^v24\\.'\n            npm --version\n            mysqladmin --protocol=socket ping\n            mysql --protocol=socket --batch --skip-column-names \\\n                -e \"SELECT @@bind_address, @@mysqlx_bind_address;\"\n            ;;\n    esac\n    echo \"Servicios de $role instalados correctamente\"\n\n    /usr/local/sbin/asistencia-deploy\n- path: /etc/asistencia-bootstrap.env\n  owner: root:root\n  permissions: '0600'\n  content: |\n    APP_ARCHIVE_URL='", {"Fn::Join": ["", ["https://github.com/borysinho/iac-cloud-init/archive/", {"Ref": "AppRevision"}, ".tar.gz"]]}, "'\n    FRONTEND_ORIGIN='", {"Fn::Join": ["", ["https://", {"Fn::GetAtt": ["GlobomaticsClient", "PublicIp"]}]]}, "'\n- path: /usr/local/sbin/asistencia-deploy\n  owner: root:root\n  permissions: '0750'\n  content: |\n    #!/bin/bash\n    set -euo pipefail\n    trap 'echo \"ERROR: despliegue de asistencia interrumpido en linea $LINENO\" >&2' ERR\n    . /etc/asistencia-bootstrap.env\n    local_ipv4=$(ip -4 -o address show scope global | awk '{split($4,a,\"/\"); print a[1]}')\n    if grep -Fxq '10.42.1.10' <<< \"$local_ipv4\"; then\n        role=client\n    elif grep -Fxq '10.42.2.20' <<< \"$local_ipv4\"; then\n        role=backend\n    else\n        echo 'IP privada desconocida' >&2; exit 1\n    fi\n    stage=$(mktemp -d)\n    trap 'rm -rf \"$stage\"' EXIT\n    curl --fail --silent --show-error --location --retry 5 --connect-timeout 10 --max-time 300 \\\n        \"$APP_ARCHIVE_URL\" -o \"$stage/app.tar.gz\"\n    tar -xzf \"$stage/app.tar.gz\" --strip-components=1 -C \"$stage\"\n    source_dir=\"$stage/app\"\n    if [[ \"$role\" == client ]]; then\n        install -d -m 0755 /var/www/asistencia\n        install -m 0644 \"$source_dir\"/public/{index.html,app.js,styles.css,config.js} /var/www/asistencia/\n        sed 's|http://192.168.1.30:8090|http://10.42.2.20:8090|' \\\n            \"$source_dir/deploy/client/asistencia.conf\" > /etc/nginx/conf.d/asistencia.conf\n        # Certificado local: clave privada solo en el cliente; SAN con su IP publica actual.\n        token=$(curl --fail --silent --show-error --max-time 10 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)\n        public_ip=$(curl --fail --silent --show-error --max-time 10 -H \"X-aws-ec2-metadata-token: $token\" http://169.254.169.254/latest/meta-data/public-ipv4)\n        python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' \"$public_ip\"\n        if [[ ! -s /etc/ssl/private/asistencia.key || ! -s /etc/ssl/certs/asistencia.crt ]] || \\\n            ! openssl x509 -in /etc/ssl/certs/asistencia.crt -noout -checkend 2592000 >/dev/null || \\\n            ! openssl x509 -in /etc/ssl/certs/asistencia.crt -noout -checkip \"$public_ip\" >/dev/null; then\n            umask 077\n            openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 365 \\\n                -keyout /etc/ssl/private/asistencia.key -out /etc/ssl/certs/asistencia.crt \\\n                -subj \"/CN=$public_ip\" -addext \"subjectAltName=IP:$public_ip,IP:10.42.1.10,IP:127.0.0.1\"\n        fi\n        chmod 0600 /etc/ssl/private/asistencia.key\n        chmod 0644 /etc/ssl/certs/asistencia.crt\n        python3 - <<'TLS'\n    from pathlib import Path\n    path = Path('/etc/nginx/conf.d/asistencia.conf')\n    content = path.read_text().replace('    listen 80;', '    listen 443 ssl;\\n    ssl_certificate /etc/ssl/certs/asistencia.crt;\\n    ssl_certificate_key /etc/ssl/private/asistencia.key;\\n    ssl_protocols TLSv1.2 TLSv1.3;')\n    redirect = 'server { listen 80; server_name _; return 301 https://$host$request_uri; }\\n'\n    path.write_text(redirect + content)\n    TLS\n        # Ubuntu incluye su sitio predeterminado en sites-enabled.\n        rm -f /etc/nginx/sites-enabled/default\n        nginx -t\n        systemctl reload nginx\n        curl --fail --silent --show-error --cacert /etc/ssl/certs/asistencia.crt https://127.0.0.1/ -o /dev/null\n    else\n        if ! id asistencia >/dev/null 2>&1; then\n            useradd --system --user-group --home-dir /opt/asistencia --no-create-home --shell /usr/sbin/nologin asistencia\n        fi\n        install -d -o root -g asistencia -m 0750 /opt/asistencia\n        # No reemplazar el archivo de secretos ni eliminar datos MySQL existentes.\n        for directory in src scripts database; do\n            cp -a \"$source_dir/$directory\" /opt/asistencia/\n        done\n        install -d -m 0750 /opt/asistencia/deploy/backend\n        install -m 0640 \"$source_dir/deploy/backend/asistencia.service\" /opt/asistencia/deploy/backend/\n        install -m 0640 \"$source_dir/package.json\" \"$source_dir/package-lock.json\" /opt/asistencia/\n        export FRONTEND_ORIGIN\n        python3 - <<'PY'\n    from pathlib import Path\n    import os, secrets, subprocess, tempfile\n    path = Path('/opt/asistencia/.env.backend')\n    values = {}\n    if path.exists():\n        for line in path.read_text().splitlines():\n            if line and not line.startswith('#'):\n                key, value = line.split('=', 1)\n                values[key] = value\n    else:\n        values = dict(DB_PASSWORD=secrets.token_hex(32), ADMIN_USER='admin', ADMIN_PASSWORD=secrets.token_hex(24))\n    # Esta cuenta y base son exclusivas de la aplicacion.\n    values.update(BACKEND_HOST='10.42.2.20', PORT='8090', FRONTEND_ORIGINS=os.environ['FRONTEND_ORIGIN'],\n                  TRUSTED_PROXIES='10.42.1.10', DB_HOST='127.0.0.1', DB_PORT='3306',\n                  DB_USER='asistencia', DB_NAME='uagrm_asistencia', INSTITUTION_TIMEZONE='America/La_Paz')\n    if not values.get('DB_PASSWORD') or len(values.get('ADMIN_PASSWORD','')) < 12:\n        raise SystemExit('Revisar credenciales del archivo existente; no se regeneran automaticamente')\n    # Guardar antes de crear el usuario permite recuperar la misma clave tras un fallo.\n    fd, temporary = tempfile.mkstemp(prefix='.env-', dir=path.parent)\n    try:\n        with os.fdopen(fd, 'w') as stream:\n            stream.write(''.join(f'{key}={value}\\n' for key,value in values.items()))\n        os.replace(temporary, path)\n    finally:\n        Path(temporary).unlink(missing_ok=True)\n    password = values['DB_PASSWORD'].replace(\"'\", \"''\")\n    sql = \"SET SESSION sql_mode='NO_BACKSLASH_ESCAPES';\\n\"\n    sql += \"CREATE DATABASE IF NOT EXISTS uagrm_asistencia CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\\n\"\n    sql += f\"CREATE USER IF NOT EXISTS 'asistencia'@'127.0.0.1' IDENTIFIED BY '{password}';\\n\"\n    sql += f\"ALTER USER 'asistencia'@'127.0.0.1' IDENTIFIED BY '{password}';\\n\"\n    sql += \"GRANT ALL PRIVILEGES ON uagrm_asistencia.* TO 'asistencia'@'127.0.0.1';\\n\"\n    subprocess.run(['mysql','--protocol=socket'], input=sql, text=True, check=True)\n    PY\n        cd /opt/asistencia\n        npm ci --omit=dev --no-audit --no-fund\n        npm run db:init\n        chown -R root:asistencia /opt/asistencia\n        chmod -R u=rwX,g=rX,o= /opt/asistencia\n        chmod 0640 /opt/asistencia/.env.backend\n        sed 's/^After=.*/After=network-online.target mysql.service\\nRequires=mysql.service/' \\\n            deploy/backend/asistencia.service > /etc/systemd/system/asistencia.service\n        systemctl daemon-reload\n        systemctl enable asistencia\n        systemctl restart asistencia\n        ready=false\n        for attempt in {1..30}; do\n            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://10.42.2.20:8090/api/me || true)\n            if [[ \"$status\" == 401 ]]; then ready=true; break; fi\n            sleep 2\n        done\n        [[ \"$ready\" == true ]]\n        systemctl is-active --quiet asistencia\n    fi\n    echo \"Aplicacion desplegada en $role; las credenciales no se imprimen en el registro\"\nruncmd:\n- - /usr/local/sbin/asistencia-install-services\n"]]}}
      # END SHARED CLOUD INIT
      ImageId: !Ref LatestAmiId
      CreditSpecification:
        CPUCredits: standard
      InstanceType: t3.micro
      KeyName: !Ref GlobomaticsKeyPair
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
            DeleteOnTermination: true
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: false
          DeleteOnTermination: true
          SubnetId: {Fn::ImportValue: !Sub '${NetworkStackName}-PrivateSubnetId'}
          PrivateIpAddress: 10.42.2.20
          GroupSet: [{Fn::ImportValue: !Sub '${NetworkStackName}-BackendSecurityGroupId'}]
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - { Key: Name, Value: !Sub "ec2-backend-${Project}-${Environment}" }
        - { Key: Role, Value: backend }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
Outputs:
  ClientInstanceId:
    Description: Identificador del EC2 cliente.
    Value: !Ref GlobomaticsClient
  ClientPublicIp:
    Description: IPv4 publica dinamica del cliente.
    Value: !GetAtt GlobomaticsClient.PublicIp
  ClientPublicDns:
    Description: DNS publico del cliente.
    Value: !GetAtt GlobomaticsClient.PublicDnsName
  ClientPrivateIp:
    Description: IPv4 privada fija del cliente.
    Value: !GetAtt GlobomaticsClient.PrivateIp
  BackendInstanceId:
    Description: Identificador del EC2 backend.
    Value: !Ref GlobomaticsBackend
  BackendPrivateIp:
    Description: IPv4 privada fija del backend.
    Value: !GetAtt GlobomaticsBackend.PrivateIp
  ClientSshCommand:
    Description: Conexion al cliente con la privada correspondiente a SshPublicKey.
    Value: !Sub "ssh -i ~/globomatics-ec2 ubuntu@${GlobomaticsClient.PublicIp}"
  BackendSshCommand:
    Description: SSH al backend privado mediante frontend; la clave privada permanece local.
    Value: !Sub 'ssh -i ~/globomatics-ec2 -o "ProxyCommand=ssh -i ~/globomatics-ec2 -W %h:%p ubuntu@${GlobomaticsClient.PublicIp}" ubuntu@${GlobomaticsBackend.PrivateIp}'
