AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Red de asistencia con subred publica para frontend y bastion, subred privada
  para backend con salida a repositorios mediante NAT. Desplegar antes de compute.yaml.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  Project:
    Type: String
    Default: asistencia
    AllowedPattern: "[a-z][a-z0-9-]{0,29}"
    Description: Proyecto usado en nombres y etiquetas.
  Environment:
    Type: String
    Default: cloudinit
    AllowedPattern: "[a-z][a-z0-9-]{0,19}"
    Description: Entorno usado como sufijo de nombres.
  SshSourceCidr:
    Type: String
    AllowedPattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])'
    ConstraintDescription: Debe ser un CIDR IPv4 valido con prefijo de 0 a 32.
    Description: IP administrativa autorizada para SSH; usar una IP /32.
  WebSourceCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Acceso HTTP publico desde cualquier IPv4; mantener 0.0.0.0/0 para la pagina publica.
    AllowedPattern: '([0-9]{1,3}\.){3}[0-9]{1,3}/(3[0-2]|[12]?[0-9])'
Resources:
  GlobomaticsVpc:
    Type: AWS::EC2::VPC
    Metadata:
      com.aws.cloudformation.Context:
        why: Red aislada para los dos servidores del laboratorio.
        must:
          [Conservar el rango que contiene las IP privadas fijas de ambos EC2.]
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "vpc-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsPublicSubnet:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
        why: Frontend y bastion publico; la IP publica se solicita explicitamente en su EC2.
        must: [Mantener el frontend 10.42.1.10 en esta subred.]
    Properties:
      VpcId: !Ref GlobomaticsVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "subnet-publica-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsInternetGateway:
    Type: AWS::EC2::InternetGateway
    Metadata:
      com.aws.cloudformation.Context:
        why: Acceso publico del frontend y salida del NAT hacia los repositorios.
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "igw-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Metadata:
      com.aws.cloudformation.Context:
        why: CloudFormation declara la union del gateway a la VPC por separado.
    Properties:
      VpcId: !Ref GlobomaticsVpc
      InternetGatewayId: !Ref GlobomaticsInternetGateway
  GlobomaticsPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
        why: Tabla explicita para la subred del laboratorio.
    Properties:
      VpcId: !Ref GlobomaticsVpc
      Tags:
        - { Key: Name, Value: !Sub "rtb-publica-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GlobomaticsGatewayAttachment
    Metadata:
      com.aws.cloudformation.Context:
        why: Enrutar Internet por el gateway unido a la VPC antes de lanzar EC2.
    Properties:
      RouteTableId: !Ref GlobomaticsPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref GlobomaticsInternetGateway
  GlobomaticsPublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: Aplicar la ruta publica exclusivamente a la subred del frontend.
    Properties:
      SubnetId: !Ref GlobomaticsPublicSubnet
      RouteTableId: !Ref GlobomaticsPublicRouteTable
  GlobomaticsPrivateSubnet:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
        why: Aislar el backend sin IP publica, con salida por NAT, en la misma zona que el frontend.
        must:
          [
            Mantener el backend 10.42.2.20 sin IP publica; salida exclusivamente por NAT.,
          ]
    Properties:
      VpcId: !Ref GlobomaticsVpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !GetAtt GlobomaticsPublicSubnet.AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "subnet-privada-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
        why: Tabla privada con salida por NAT para instalar los servicios del backend.
        must: [La ruta predeterminada debe apuntar al NAT; nunca directamente al Internet Gateway.]
    Properties:
      VpcId: !Ref GlobomaticsVpc
      Tags:
        - { Key: Name, Value: !Sub "rtb-privada-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsPrivateRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: Aplicar la tabla privada al backend y a futuros EC2 de esta subred.
    Properties:
      SubnetId: !Ref GlobomaticsPrivateSubnet
      RouteTableId: !Ref GlobomaticsPrivateRouteTable
  GlobomaticsClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Frontend y bastion; HTTP desde el CIDR web autorizado y SSH solo desde el CIDR administrativo.
        must:
          [
            SSH publico solo en el frontend; backend accesible mediante este bastion.,
          ]
    Properties:
      GroupDescription: Frontend HTTP publico y bastion SSH
      VpcId: !Ref GlobomaticsVpc
      SecurityGroupIngress:
        - {
            Description: SSH al bastion desde el CIDR autorizado,
            IpProtocol: tcp,
            FromPort: 22,
            ToPort: 22,
            CidrIp: !Ref SshSourceCidr,
          }
        - {
            Description: Acceso web publico HTTP,
            IpProtocol: tcp,
            FromPort: 80,
            ToPort: 80,
            CidrIp: !Ref WebSourceCidr,
          }
      SecurityGroupEgress:
        - {
            Description: Salida para actualizaciones y configuracion,
            IpProtocol: "-1",
            CidrIp: 0.0.0.0/0,
          }
      Tags:
        - { Key: Name, Value: !Sub "secgrp-cliente-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsBackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Backend privado; API y SSH solo desde el grupo del frontend que tambien actua como bastion.
        must:
          - API accesible solo desde el grupo del cliente; ninguna entrada de base de datos.
          - SSH solo desde el grupo del frontend; nunca SSH directo desde Internet.
    Properties:
      GroupDescription: Backend privado; API y SSH solo desde frontend; MySQL local
      VpcId: !Ref GlobomaticsVpc
      SecurityGroupIngress:
        - {
            Description: SSH privado desde el frontend bastion,
            IpProtocol: tcp,
            FromPort: 22,
            ToPort: 22,
            SourceSecurityGroupId: !Ref GlobomaticsClientSecurityGroup,
          }
        - Description: TCP 8090 por IP privada desde el servidor cliente
          IpProtocol: tcp
          FromPort: 8090
          ToPort: 8090
          SourceSecurityGroupId: !Ref GlobomaticsClientSecurityGroup
      SecurityGroupEgress:
        - {
            Description: Salida por NAT para paquetes del backend,
            IpProtocol: "-1",
            CidrIp: 0.0.0.0/0,
          }
      Tags:
        - { Key: Name, Value: !Sub "secgrp-backend-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
        - { Key: ManagedBy, Value: CloudFormation }
  GlobomaticsNatEip:
    Type: AWS::EC2::EIP
    DependsOn: GlobomaticsGatewayAttachment
    Metadata:
      com.aws.cloudformation.Context:
        why: Direccion publica del NAT para descargar los paquetes del backend privado.
        must: [No asignar esta IP al backend.]
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "eip-nat-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
  GlobomaticsNatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: GlobomaticsDefaultRoute
    Metadata:
      com.aws.cloudformation.Context:
        why: Salida a repositorios desde la subred privada sin publicar el backend.
        must: [Ubicar en la subred publica; tiene costo mientras exista.]
    Properties:
      AllocationId: !GetAtt GlobomaticsNatEip.AllocationId
      SubnetId: !Ref GlobomaticsPublicSubnet
      ConnectivityType: public
      Tags:
        - { Key: Name, Value: !Sub "nat-${Project}-${Environment}" }
        - { Key: Project, Value: !Ref Project }
  GlobomaticsPrivateDefaultRoute:
    Type: AWS::EC2::Route
    Metadata:
      com.aws.cloudformation.Context:
        why: Permitir descargas HTTPS y HTTP de paquetes durante cloud-init.
        must: [Conservar el backend sin IP publica y sin entradas adicionales.]
    Properties:
      RouteTableId: !Ref GlobomaticsPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref GlobomaticsNatGateway
Outputs:
  VpcId:
    Description: VPC del laboratorio; subred y grupos pertenecen a esta VPC.
    Value: !Ref GlobomaticsVpc
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
  PublicSubnetId:
    Description: Subred publica para el parametro PublicSubnetId de compute.yaml.
    Value: !Ref GlobomaticsPublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId'
  PrivateSubnetId:
    Description: Subred privada para el parametro PrivateSubnetId de compute.yaml.
    Value: !Ref GlobomaticsPrivateSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetId'
  ClientSecurityGroupId:
    Description: Grupo del cliente para el parametro ClientSecurityGroupId de compute.yaml.
    Value: !Ref GlobomaticsClientSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-ClientSecurityGroupId'
  BackendSecurityGroupId:
    Description: Grupo del backend para el parametro BackendSecurityGroupId de compute.yaml.
    Value: !Ref GlobomaticsBackendSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-BackendSecurityGroupId'
